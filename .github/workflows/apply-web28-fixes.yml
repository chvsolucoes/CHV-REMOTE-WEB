name: Apply CHV Remote Web 2.8 interaction fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-web28-fixes.yml'
      - 'tools/apply_web28.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply Web 2.8 patch
        run: python tools/apply_web28.py
      - name: Commit Web 2.8
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "CHV Remote Build Bot"
          git config user.email "chvremote-bot@users.noreply.github.com"
          git add pwa/app.js pwa/sw.js
          git commit -m "CHV Remote Web 2.8 interaction fixes"
          git push
