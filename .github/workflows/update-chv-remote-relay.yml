name: Update CHV Remote Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-chv-remote-relay.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chv-remote-relay-update
  cancel-in-progress: true

jobs:
  update-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published PWA
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Discover and verify current CHV Relay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'websockets>=15,<17' requests
          python - <<'PY'
          import asyncio, json, re, time, requests, websockets
          html=requests.get('https://linktr.ee/chvsolucoes',timeout=20,headers={'User-Agent':'Mozilla/5.0'}).text
          hosts=[]
          for h in re.findall(r'https?://([a-zA-Z0-9.-]+\.trycloudflare\.com)',html):
              if h not in hosts: hosts.append(h)
          if not hosts:
              raise SystemExit('No CHV relay candidate found')
          async def probe(host):
              url='wss://'+host
              try:
                  async with websockets.connect(url,open_timeout=10,close_timeout=3,max_size=2**20) as ws:
                      await ws.send(json.dumps({'type':'hello','role':'probe','client':'chv-remote-pwa','version':25,'nonce':str(time.time_ns())}))
                      raw=await asyncio.wait_for(ws.recv(),timeout=10)
                      obj=json.loads(raw)
                      if obj.get('type')=='health' and obj.get('status')=='ok' and obj.get('service')=='chv-relay':
                          return url
              except Exception as e:
                  print('probe failed',url,type(e).__name__)
          async def main():
              for host in hosts:
                  url=await probe(host)
                  if url:
                      with open('relay.json','w') as f:
                          json.dump({'url':url,'updated':int(time.time())},f)
                          f.write('\n')
                      print('CHV_PWA_RELAY_OK',url)
                      return
              raise SystemExit('No healthy CHV relay candidate')
          asyncio.run(main())
          PY

      - name: Publish relay change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- relay.json; then
            echo CHV_RELAY_ALREADY_CURRENT
            exit 0
          fi
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add relay.json
          git commit -m 'Update CHV Remote relay endpoint'
          git push origin HEAD:gh-pages
