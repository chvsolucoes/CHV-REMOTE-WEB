name: Apply CHV Remote Web 2.3 interaction fixes
on:
  push:
    paths:
      - '.github/workflows/apply-chv-web-v23.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CHV Remote Web 2.3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pwa/app.js')
          s=p.read_text()
          def rep(old,new,count=1):
              global s
              if old not in s:
                  raise SystemExit('missing app.js pattern: '+old[:100])
              s=s.replace(old,new,count)

          rep("keyboardComposing:false,edgeGesture:null,menuOpen:false,quickPasswordTarget:null,\n  modifiers:new Set()", "keyboardComposing:false,edgeGesture:null,menuOpen:false,quickPasswordTarget:null,panGesture:null,\n  modifiers:new Set()")

          rep("function qProfile(){\n  return settings.quality==='quality'?[1920,1080,'contain']:\n         settings.quality==='speed'?[1280,720,'contain']:[1600,900,'contain'];\n}", "function qProfile(){\n  return settings.quality==='quality'?[2560,1440,'contain']:\n         settings.quality==='speed'?[1280,720,'contain']:[1920,1080,'contain'];\n}")

          rep("const [w,h,fit]=qProfile();wsSend({type:'screen_profile',width:w,height:h,fit});", "const [w,h,fit]=qProfile();wsSend({type:'screen_profile',width:w,height:h,fit});setTimeout(requestSharpFrame,220);")

          rep("function resetGestureFlags(){\n  state.moved=false;state.dragging=false;state.longPressFired=false;state.lastPointer=null;clearLongPress();\n}\nfunction pointerDown(e){", "function resetGestureFlags(){\n  state.moved=false;state.dragging=false;state.longPressFired=false;state.lastPointer=null;state.panGesture=null;clearLongPress();\n}\nfunction fitImageBase(){\n  const wr=$('#screenWrap').getBoundingClientRect();\n  const iw=Math.max(1,state.remoteW||wr.width),ih=Math.max(1,state.remoteH||wr.height);\n  const scale=Math.min(wr.width/iw,wr.height/ih);\n  return {wrapW:wr.width,wrapH:wr.height,width:iw*scale,height:ih*scale};\n}\nfunction clampPan(){\n  if(state.zoom<=1){state.panX=0;state.panY=0;return}\n  const f=fitImageBase();\n  const maxX=Math.max(0,(f.width*state.zoom-f.wrapW)/2);\n  const maxY=Math.max(0,(f.height*state.zoom-f.wrapH)/2);\n  state.panX=Math.max(-maxX,Math.min(maxX,state.panX));\n  state.panY=Math.max(-maxY,Math.min(maxY,state.panY));\n}\nfunction pointerDown(e){")

          rep("state.lastPointer={x:e.clientX,y:e.clientY,time:performance.now()};\n  const p=settings.pointerMode==='mouse'?state.cursor:normalizedPoint(e.clientX,e.clientY);", "state.lastPointer={x:e.clientX,y:e.clientY,time:performance.now()};\n  if(state.zoom>1)state.panGesture={id:e.pointerId,startX:e.clientX,startY:e.clientY,panX:state.panX,panY:state.panY};\n  const p=settings.pointerMode==='mouse'?state.cursor:normalizedPoint(e.clientX,e.clientY);")

          rep("const dx=e.clientX-prev.x,dy=e.clientY-prev.y;\n  if(Math.hypot(e.clientX-ptr.startX,e.clientY-ptr.startY)>8){state.moved=true;clearLongPress()}\n  if(settings.pointerMode==='mouse'){", "const dx=e.clientX-prev.x,dy=e.clientY-prev.y;\n  if(Math.hypot(e.clientX-ptr.startX,e.clientY-ptr.startY)>8){state.moved=true;clearLongPress()}\n  if(state.zoom>1&&state.panGesture?.id===e.pointerId&&state.moved){\n    state.panX=state.panGesture.panX+(e.clientX-state.panGesture.startX);\n    state.panY=state.panGesture.panY+(e.clientY-state.panGesture.startY);\n    clampPan();applyTransform();requestSharpFrame();return;\n  }\n  if(settings.pointerMode==='mouse'){")

          rep("const start=normalizedPoint(ptr.startX,ptr.startY);sendMouse('down',start,{button:'left'});\n    }\n    sendMouse('move',p);", "const start=normalizedPoint(ptr.startX,ptr.startY);sendMouse('down',start,{button:'left'});\n    }\n    sendMouse('move',p,{button:'left',buttons:1});")

          rep("if(state.dragging)sendMouse('up',p,{button:'left'});else if(!state.moved){clickAt(p,'left');probeTextFocus(p)}", "if(state.dragging){sendMouse('move',p,{button:'left',buttons:1});sendMouse('up',p,{button:'left'})}else if(!state.moved){clickAt(p,'left');probeTextFocus(p)}")

          rep("function applyTransform(){\n  const vp=$('#screenViewport');", "function applyTransform(){\n  clampPan();\n  const vp=$('#screenViewport');")

          rep("let w=1600,h=900;\n    if(settings.quality==='speed'){w=1280;h=720}\n    if(settings.quality==='quality'){w=2560;h=1440}", "let w=1920,h=1080;\n    if(settings.quality==='speed'){w=1280;h=720}\n    if(settings.quality==='quality'){w=2560;h=1440}")

          rep("state.fullscreenFallback=!!on;\n  $('#sessionView').classList.toggle('immersive',!!on);document.body.classList.toggle('session-immersive',!!on);", "state.fullscreenFallback=!!on;\n  $('#sessionView').classList.toggle('immersive',!!on);document.body.classList.toggle('session-immersive',!!on);document.documentElement.classList.toggle('session-immersive',!!on);")

          rep("sw.addEventListener('pointerdown',pointerDown,{passive:false});sw.addEventListener('pointermove',pointerMove,{passive:false});sw.addEventListener('pointerup',pointerUp,{passive:false});sw.addEventListener('pointercancel',pointerCancel,{passive:false});sw.addEventListener('wheel',wheel,{passive:false});sw.addEventListener('contextmenu',e=>e.preventDefault());", "sw.addEventListener('pointerdown',pointerDown,{passive:false});sw.addEventListener('pointermove',pointerMove,{passive:false});sw.addEventListener('pointerup',pointerUp,{passive:false});sw.addEventListener('pointercancel',pointerCancel,{passive:false});sw.addEventListener('wheel',wheel,{passive:false});sw.addEventListener('contextmenu',e=>e.preventDefault());sw.addEventListener('selectstart',e=>e.preventDefault());sw.addEventListener('dragstart',e=>e.preventDefault());\nconst sessionActive=()=>$('#sessionView').classList.contains('active');\ndocument.addEventListener('selectstart',e=>{if(sessionActive()&&!e.target.closest?.('input,textarea'))e.preventDefault()},{capture:true});\ndocument.addEventListener('contextmenu',e=>{if(sessionActive()&&!e.target.closest?.('input,textarea'))e.preventDefault()},{capture:true});\ndocument.addEventListener('dragstart',e=>{if(sessionActive())e.preventDefault()},{capture:true});\ndocument.addEventListener('selectionchange',()=>{if(sessionActive()){const sel=window.getSelection?.();if(sel&&!$('#nativeKeyboardInput').matches(':focus'))try{sel.removeAllRanges()}catch{}}});")

          rep("window.addEventListener('resize',()=>requestAnimationFrame(updateCursorVisual));", "window.addEventListener('resize',()=>requestAnimationFrame(()=>{clampPan();applyTransform();requestSharpFrame()}));")

          p.write_text(s)

          p=Path('pwa/app.css')
          css=p.read_text()
          css += r'''

/* CHV Remote Web 2.3 - touch isolation, zoom pan and fullscreen safe-area fixes */
.session-view,.session-view *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.session-view{-webkit-user-drag:none;touch-action:none}
.screen-wrap,.screen-wrap *{overscroll-behavior:none;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
.screen-viewport,.screen-viewport img{touch-action:none!important;-webkit-user-drag:none!important;user-drag:none!important}
.metrics,.metrics span,.zoom-badge,.control-badge,.session-bar,.session-bar *{user-select:none!important;-webkit-user-select:none!important;-webkit-touch-callout:none!important}
.screen-viewport img{image-rendering:auto!important;filter:none;will-change:transform;}
.edge-handle{left:max(0px,env(safe-area-inset-left));bottom:28%;}
.edge-menu{left:calc(env(safe-area-inset-left) + 10px);top:50%;bottom:auto;transform:translateY(-50%);gap:clamp(5px,1.15vh,10px);max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 18px);}
.edge-submenu{left:calc(env(safe-area-inset-left) + 78px);top:50%;bottom:auto;transform:translateY(-50%);gap:8px;}
.session-view.immersive .edge-handle{left:max(0px,env(safe-area-inset-left));bottom:26%;}
.session-view.immersive .edge-menu{left:calc(env(safe-area-inset-left) + 10px);top:50%;bottom:auto;transform:translateY(-50%);}
.session-view.immersive .edge-submenu{left:calc(env(safe-area-inset-left) + 76px);top:50%;bottom:auto;transform:translateY(-50%);}
body.session-immersive .sheet,html.session-immersive .sheet{z-index:240!important;pointer-events:auto!important}
body.session-immersive .toast,html.session-immersive .toast{z-index:260!important}
body.session-immersive #app,html.session-immersive #app{height:100dvh!important;overflow:hidden!important;background:#000!important}
@media(orientation:landscape) and (max-height:520px){
  .edge-menu{top:50%!important;bottom:auto!important;gap:5px!important;transform:translateY(-50%)!important}
  .edge-submenu{top:50%!important;bottom:auto!important;transform:translateY(-50%)!important}
  .edge-bubble{width:44px!important;height:44px!important;font-size:19px!important;border-width:2px!important}
  .edge-bubble small{left:50px!important}
}
'''
          p.write_text(css)

          p=Path('pwa/index.html')
          h=p.read_text().replace('Versão PWA 2.2.0','Versão PWA 2.3.0')
          p.write_text(h)

          p=Path('pwa/sw.js')
          sw=p.read_text().replace("chv-remote-pwa-v2.2.0","chv-remote-pwa-v2.3.0")
          p.write_text(sw)
          PY
          node --check pwa/app.js
          grep -q 'Versão PWA 2.3.0' pwa/index.html
          grep -q 'chv-remote-pwa-v2.3.0' pwa/sw.js
      - name: Commit source and publish gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/app.css pwa/index.html pwa/sw.js
          git commit -m 'Fix CHV Remote Web mobile gestures and fullscreen UX'
          git push origin main
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          git show main:pwa/app.js > app.js
          git show main:pwa/app.css > app.css
          git show main:pwa/index.html > index.html
          git show main:pwa/sw.js > sw.js
          git add app.js app.css index.html sw.js
          git commit -m 'Publish CHV Remote Web 2.3'
          git push origin gh-pages