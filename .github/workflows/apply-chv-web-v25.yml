name: Apply CHV Remote Web 2.5
on:
  push:
    paths:
      - '.github/workflows/apply-chv-web-v25.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate 2.5
        run: |
          python3 tools/apply_v25.py
          node --check pwa/app.js
          grep -q 'Versão PWA 2.5.0' pwa/index.html
          grep -q 'chv-remote-pwa-v2.5.0' pwa/sw.js
          grep -q 'function resolveTextFocus' pwa/app.js
          grep -q 'function queueMouseMove' pwa/app.js
          grep -q 'doubleTapDrag' pwa/app.js
          grep -q 'function renderFrame' pwa/app.js
          grep -q 'stream_tuning' pwa/app.js
      - name: Commit and publish 2.5
        run: |
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/app.css pwa/index.html pwa/sw.js
          git commit -m 'Improve keyboard focus, double-drag and low-latency streaming'
          git push origin main
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          git show main:pwa/app.js > app.js
          git show main:pwa/app.css > app.css
          git show main:pwa/index.html > index.html
          git show main:pwa/sw.js > sw.js
          git add app.js app.css index.html sw.js
          git commit -m 'Publish CHV Remote Web 2.5'
          git push origin gh-pages
