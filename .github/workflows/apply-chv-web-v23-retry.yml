name: Apply CHV Remote Web 2.3 retry
on:
  push:
    paths:
      - '.github/workflows/apply-chv-web-v23-retry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python3 tools/apply_v23.py
          node --check pwa/app.js
          grep -q 'Versão PWA 2.3.0' pwa/index.html
          grep -q 'chv-remote-pwa-v2.3.0' pwa/sw.js
      - name: Commit and publish
        run: |
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/app.css pwa/index.html pwa/sw.js
          git commit -m 'Fix CHV Remote Web mobile gestures and fullscreen UX'
          git push origin main
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          git show main:pwa/app.js > app.js
          git show main:pwa/app.css > app.css
          git show main:pwa/index.html > index.html
          git show main:pwa/sw.js > sw.js
          git add app.js app.css index.html sw.js
          git commit -m 'Publish CHV Remote Web 2.3'
          git push origin gh-pages