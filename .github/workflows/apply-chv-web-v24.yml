name: Apply CHV Remote Web 2.4
on:
  push:
    paths:
      - '.github/workflows/apply-chv-web-v24.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CHV Remote Web 2.4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('pwa/app.js')
          s=p.read_text()

          def replace_once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit('missing '+label)
              s=s.replace(old,new,1)

          def replace_between(start,end,new,label):
              global s
              a=s.find(start)
              if a<0: raise SystemExit('missing start '+label)
              b=s.find(end,a)
              if b<0: raise SystemExit('missing end '+label)
              s=s[:a]+new+s[b:]

          replace_once(
              "  modifiers:new Set(),ctrlHoldTimer:null,ctrlLong:false,fullscreenFallback:false,sharpTimer:null,lastFocusProbeAt:0\n};",
              "  modifiers:new Set(),ctrlHoldTimer:null,ctrlLong:false,fullscreenFallback:false,sharpTimer:null,lastFocusProbeAt:0,\n  currentCode:null,lastThumbAt:0,mouseDragArmTimer:null,mouseDragArmed:false\n};",
              'state extras')
          replace_once("let history=store.get('history',[]);", "let history=store.get('history',[]);\nlet thumbnails=store.get('thumbnails',{});", 'thumbnail store')

          replace_between('function showView(id){','\nfunction qProfile(){',r'''function showView(id){
  $$('.view').forEach(v=>v.classList.toggle('active',v.id===id));
  $('#bottomNav').style.display=id==='sessionView'?'none':'flex';
  $$('#bottomNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));
  const active=id==='sessionView';
  document.documentElement.classList.toggle('session-active',active);
  document.body.classList.toggle('session-active',active);
}
''','showView')

          replace_between('function qProfile(){','\nfunction uniqueCodes(){',r'''function qProfile(){
  return settings.quality==='quality'?[2880,1620,'contain']:
         settings.quality==='speed'?[1600,900,'contain']:[2304,1296,'contain'];
}
''','qProfile')

          replace_once("state.onlineCodes.add(code);setStatus('Conectado');\n      const [w,h,fit]=qProfile();", "state.onlineCodes.add(code);setStatus('Conectado');state.currentCode=code;\n      const [w,h,fit]=qProfile();", 'current code')

          replace_between('function frame(u){','\nfunction imageBox(){',r'''function frame(u){
  if(u.length<10)return;
  state.remoteW=be32(u,1);state.remoteH=be32(u,5);
  const now=performance.now(),dt=Math.max(1,now-state.frameAt);state.frameAt=now;
  const ifps=1000/dt,imbps=(u.length*8/1e6)/(dt/1000);
  state.fps=state.fps?state.fps*.82+ifps*.18:ifps;
  state.mbps=state.mbps?state.mbps*.82+imbps*.18:imbps;
  $('#fpsMetric').textContent=state.fps.toFixed(0)+' FPS';
  $('#mbpsMetric').textContent=state.mbps.toFixed(1)+' Mbps';
  const blob=new Blob([u.slice(9)],{type:'image/jpeg'}),url=URL.createObjectURL(blob),img=$('#remoteScreen'),old=img.dataset.url;
  img.onload=()=>{
    if(old)URL.revokeObjectURL(old);
    $('#screenPlaceholder').style.display='none';
    updateCursorVisual();
    saveThumbnail(false);
  };
  img.dataset.url=url;img.src=url;
}
''','frame')

          replace_once("function clickAt(p,button='left'){\n  sendMouse('down',p,{button});sendMouse('up',p,{button});\n}", "function clickAt(p,button='left'){\n  sendMouse('down',p,{button});sendMouse('up',p,{button});\n  setTimeout(requestSharpFrame,90);\n}", 'click refresh')

          replace_between('function saveConnection(id,password){','\nfunction isFavorite(id){',r'''function saveThumbnail(force=false){
  const code=state.currentCode,img=$('#remoteScreen');
  if(!code||!img?.src||!img.naturalWidth)return;
  const now=Date.now();
  if(!force&&now-state.lastThumbAt<6000)return;
  state.lastThumbAt=now;
  try{
    const cw=320,ch=180,canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;
    const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#071019';ctx.fillRect(0,0,cw,ch);
    const scale=Math.min(cw/img.naturalWidth,ch/img.naturalHeight),w=img.naturalWidth*scale,h=img.naturalHeight*scale;
    ctx.drawImage(img,(cw-w)/2,(ch-h)/2,w,h);
    thumbnails[code]=canvas.toDataURL('image/jpeg',.62);
    store.set('thumbnails',thumbnails);renderLists();
  }catch{}
}
function saveConnection(id,password){
  const now=new Date().toISOString();
  const old=history.find(x=>x.id===id),fav=favorites.find(x=>x.id===id);
  history=[{id,name:old?.name||fav?.name||'',date:now,password:settings.savePasswords?password:''},...history.filter(x=>x.id!==id)].slice(0,30);
  store.set('history',history);
  const existing=favorites.find(x=>x.id===id);
  if(existing&&settings.savePasswords){existing.password=password;store.set('favorites',favorites)}
  renderLists();
}
''','saveConnection')

          replace_between('function toggleFavorite(id,password=\'\'){','\nfunction rowStatus(id){',r'''function toggleFavorite(id,password=''){
  const idx=favorites.findIndex(x=>x.id===id);
  if(idx>=0){
    favorites.splice(idx,1);toast('Removido dos favoritos');
  }else{
    const h=history.find(x=>x.id===id);
    favorites.unshift({id,name:h?.name||'',password:settings.savePasswords?(password||h?.password||''):''});
    toast('Adicionado aos favoritos');
  }
  store.set('favorites',favorites);renderLists();refreshPresence();
}
function renameConnection(id){
  const h=history.find(x=>x.id===id),f=favorites.find(x=>x.id===id),old=(h?.name||f?.name||'');
  const value=window.prompt('Nome desta conexão',old||'Meu computador');
  if(value===null)return;
  const name=value.trim().slice(0,40);
  history=history.map(x=>x.id===id?{...x,name}:x);
  favorites=favorites.map(x=>x.id===id?{...x,name}:x);
  store.set('history',history);store.set('favorites',favorites);renderLists();
}
''','toggleFavorite')

          replace_between('function listItem(item,kind){','\nfunction renderLists(){',r'''function listItem(item,kind){
  const id=item.id,password=item.password||'',date=item.date||'',name=item.name||'',fav=isFavorite(id),online=rowStatus(id);
  const el=document.createElement('div');el.className='list-item';
  el.innerHTML='<div class="pc cover"><span>▣</span><i class="status-dot '+online+'"></i></div><div class="info"><strong></strong><small></small></div><div class="list-actions"><button class="rename" aria-label="Renomear">✎</button><button class="star '+(fav?'active':'')+'" aria-label="'+(fav?'Remover dos favoritos':'Adicionar aos favoritos')+'">'+(fav?'★':'☆')+'</button><button class="go">Conectar</button></div>';
  const cover=el.querySelector('.cover'),thumb=thumbnails[id];
  if(thumb){cover.classList.add('has-thumb');cover.style.backgroundImage='url("'+thumb+'")'}
  el.querySelector('strong').textContent=name||('ID '+id);
  el.querySelector('small').textContent=(name?'ID '+id+' • ':'')+(online==='online'?'Online':online==='offline'?'Offline':'Verificando…')+(date?' • '+new Date(date).toLocaleString('pt-BR'):'');
  el.querySelector('.rename').onclick=e=>{e.stopPropagation();renameConnection(id)};
  el.querySelector('.star').onclick=e=>{e.stopPropagation();toggleFavorite(id,password)};
  el.querySelector('.go').onclick=e=>{e.stopPropagation();connectSavedItem({id,password,date,name})};
  el.querySelector('.info').onclick=()=>connectSavedItem({id,password,date,name});
  if(kind==='favorite'&&!password)el.querySelector('.go').title='Informe a senha antes de conectar';
  return el;
}
''','listItem')

          replace_between('function disconnect(){','\nfunction applyPointerMode(mode){',r'''function disconnect(){
  saveThumbnail(true);
  try{state.ws?.close(1000)}catch{}
  state.ws=null;state.connected=false;state.currentCode=null;
  $('#remoteScreen').removeAttribute('src');$('#screenPlaceholder').style.display='flex';
  closeEdgeMenu();closeAllSheets();releaseModifiers();
  showView('homeView');setStatus('Pronto para conectar');resetViewTransform();setImmersive(false);updateConnectButton();refreshPresence();
}
''','disconnect')

          replace_between('function clearLongPress(){','\nfunction pinchSnapshot(){',r'''function clearLongPress(){
  clearTimeout(state.longPressTimer);state.longPressTimer=null;
}
function clearMouseDragArm(){clearTimeout(state.mouseDragArmTimer);state.mouseDragArmTimer=null;state.mouseDragArmed=false}
function startLongPress(p){
  clearLongPress();state.longPressFired=false;
  state.longPressTimer=setTimeout(()=>{
    state.longPressFired=true;clearMouseDragArm();
    const target=settings.pointerMode==='mouse'?state.cursor:p;
    clickAt(target,'right');try{navigator.vibrate?.(18)}catch{};toast('Clique direito');
  },620);
}
function resetGestureFlags(){
  state.moved=false;state.dragging=false;state.longPressFired=false;state.lastPointer=null;state.panGesture=null;clearLongPress();clearMouseDragArm();
}
function fitImageBase(){
  const wr=$('#screenWrap').getBoundingClientRect();
  const iw=Math.max(1,state.remoteW||wr.width),ih=Math.max(1,state.remoteH||wr.height);
  const scale=Math.min(wr.width/iw,wr.height/ih);
  return {wrapW:wr.width,wrapH:wr.height,width:iw*scale,height:ih*scale};
}
function clampPan(){
  if(state.zoom<=1){state.panX=0;state.panY=0;return}
  const f=fitImageBase();
  const maxX=Math.max(0,(f.width*state.zoom-f.wrapW)/2);
  const maxY=Math.max(0,(f.height*state.zoom-f.wrapH)/2);
  state.panX=Math.max(-maxX,Math.min(maxX,state.panX));
  state.panY=Math.max(-maxY,Math.min(maxY,state.panY));
}
function followCursorPan(){
  if(state.zoom<=1)return;
  const f=fitImageBase(),sw=f.width*state.zoom,sh=f.height*state.zoom;
  const mx=Math.max(42,Math.min(96,f.wrapW*.18)),my=Math.max(42,Math.min(96,f.wrapH*.18));
  let sx=f.wrapW/2+state.panX+(state.cursor.x-.5)*sw;
  let sy=f.wrapH/2+state.panY+(state.cursor.y-.5)*sh;
  if(sx<mx)state.panX+=mx-sx;else if(sx>f.wrapW-mx)state.panX-=sx-(f.wrapW-mx);
  if(sy<my)state.panY+=my-sy;else if(sy>f.wrapH-my)state.panY-=sy-(f.wrapH-my);
  clampPan();applyTransform();
}
function pointerDown(e){
  if(!state.connected)return;
  if(e.target.closest?.('button,.edge-menu,.edge-submenu'))return;
  const wr=$('#screenWrap').getBoundingClientRect();
  if(e.clientX-wr.left<=24){
    e.preventDefault();state.edgeGesture={id:e.pointerId,startX:e.clientX,startY:e.clientY};return;
  }
  e.preventDefault();$('#screenWrap').setPointerCapture?.(e.pointerId);
  state.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,time:performance.now()});
  if(state.pointers.size===2){clearLongPress();clearMouseDragArm();state.gesture=pinchSnapshot();return}
  if(state.pointers.size>2)return;
  state.lastPointer={x:e.clientX,y:e.clientY,time:performance.now()};
  if(settings.pointerMode==='mouse'){
    clearMouseDragArm();
    const pid=e.pointerId;
    state.mouseDragArmTimer=setTimeout(()=>{if(state.pointers.has(pid)&&!state.moved&&!state.longPressFired)state.mouseDragArmed=true},140);
  }
  const p=settings.pointerMode==='mouse'?state.cursor:normalizedPoint(e.clientX,e.clientY);
  startLongPress(p);
}
function pointerMove(e){
  if(state.edgeGesture&&state.edgeGesture.id===e.pointerId){
    e.preventDefault();if(e.clientX-state.edgeGesture.startX>42){openEdgeMenu();state.edgeGesture=null}return;
  }
  const ptr=state.pointers.get(e.pointerId);if(!ptr)return;
  e.preventDefault();
  const prev={x:ptr.x,y:ptr.y};ptr.x=e.clientX;ptr.y=e.clientY;
  if(state.pointers.size>=2){clearLongPress();clearMouseDragArm();handlePinch();return}
  const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
  if(Math.hypot(e.clientX-ptr.startX,e.clientY-ptr.startY)>8){state.moved=true;clearLongPress()}
  if(settings.pointerMode==='mouse'){
    if(!state.moved)return;
    const before={x:state.cursor.x,y:state.cursor.y},wr=$('#screenWrap').getBoundingClientRect();
    if(state.mouseDragArmed&&!state.dragging){state.dragging=true;sendMouse('down',before,{button:'left'})}
    state.cursor.x=Math.max(0,Math.min(1,state.cursor.x+dx/Math.max(180,wr.width*.9)));
    state.cursor.y=Math.max(0,Math.min(1,state.cursor.y+dy/Math.max(180,wr.height*.9)));
    sendMouse('move',state.cursor,state.dragging?{button:'left',buttons:1}:{});
    if(state.zoom>1)followCursorPan();else updateCursorVisual();
  }else if(state.moved){
    const p=normalizedPoint(e.clientX,e.clientY);
    if(!state.dragging){state.dragging=true;const start=normalizedPoint(ptr.startX,ptr.startY);sendMouse('down',start,{button:'left'})}
    sendMouse('move',p,{button:'left',buttons:1});
  }
}
function pointerUp(e){
  if(state.edgeGesture&&state.edgeGesture.id===e.pointerId){state.edgeGesture=null;return}
  const ptr=state.pointers.get(e.pointerId);if(!ptr)return;
  e.preventDefault();clearLongPress();clearTimeout(state.mouseDragArmTimer);
  const wasMulti=state.pointers.size>1;state.pointers.delete(e.pointerId);
  if(wasMulti){if(state.pointers.size<2)state.gesture=null;clearMouseDragArm();return}
  if(state.longPressFired){resetGestureFlags();return}
  if(settings.pointerMode==='mouse'){
    if(state.dragging){sendMouse('up',state.cursor,{button:'left'});setTimeout(requestSharpFrame,80)}
    else if(!state.moved){clickAt(state.cursor,'left');probeTextFocus(state.cursor)}
  }else{
    const p=normalizedPoint(e.clientX,e.clientY);
    if(state.dragging){sendMouse('move',p,{button:'left',buttons:1});sendMouse('up',p,{button:'left'});setTimeout(requestSharpFrame,80)}
    else if(!state.moved){clickAt(p,'left');probeTextFocus(p)}
  }
  resetGestureFlags();
}
function pointerCancel(e){
  if(state.edgeGesture&&state.edgeGesture.id===e.pointerId){state.edgeGesture=null;return}
  const ptr=state.pointers.get(e.pointerId);
  if(ptr&&state.dragging){
    const p=settings.pointerMode==='mouse'?state.cursor:normalizedPoint(ptr.x,ptr.y);sendMouse('up',p,{button:'left'});
  }
  state.pointers.delete(e.pointerId);resetGestureFlags();
}
''','pointer block')

          replace_once("let w=1920,h=1080;\n    if(settings.quality==='speed'){w=1280;h=720}\n    if(settings.quality==='quality'){w=2560;h=1440}\n    if(state.zoom>=1.45){w=Math.max(w,2560);h=Math.max(h,1440)}\n    if(state.zoom>=2.6){w=Math.max(w,3840);h=Math.max(h,2160)}", "let w=2304,h=1296;\n    if(settings.quality==='speed'){w=1600;h=900}\n    if(settings.quality==='quality'){w=2880;h=1620}\n    if(state.zoom>=1.35){w=Math.max(w,2880);h=Math.max(h,1620)}\n    if(state.zoom>=2.2){w=Math.max(w,3840);h=Math.max(h,2160)}", 'sharp profile')

          replace_once("const sessionActive=()=>$('#sessionView').classList.contains('active');", "const sessionActive=()=>$('#sessionView').classList.contains('active');\nconst blockIOSNativeGesture=e=>{if(!sessionActive())return;if(e.target.closest?.('button,input,textarea,select,.sheet-card'))return;if(e.cancelable)e.preventDefault()};\n['touchstart','touchmove','touchend','touchcancel','gesturestart','gesturechange','gestureend'].forEach(t=>sw.addEventListener(t,blockIOSNativeGesture,{passive:false}));", 'iOS gesture block')

          p.write_text(s)

          p=Path('pwa/app.css')
          css=p.read_text()+r'''

/* CHV Remote Web 2.4 - native iOS gesture isolation, cursor-follow zoom and connection covers */
html.session-active,body.session-active{overscroll-behavior:none!important;touch-action:none!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
body.session-active #sessionView,body.session-active #sessionView *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important}
body.session-active #screenWrap,body.session-active #screenWrap *{touch-action:none!important;-webkit-user-drag:none!important}
body.session-active #screenWrap ::selection,body.session-active #sessionView ::selection{background:transparent!important;color:inherit!important}
.metrics,.zoom-badge,.control-badge,.remote-cursor,#screenPlaceholder{pointer-events:none!important}
.list-item .pc.cover{width:84px;height:52px;flex:0 0 84px;border-radius:10px;background:#0b1723 center/cover no-repeat;overflow:hidden;color:#dce8f3}
.list-item .pc.cover>span{font-size:20px;opacity:.8}.list-item .pc.cover.has-thumb>span{display:none}
.list-item .pc.cover .status-dot{right:4px;bottom:4px;border-color:#fff;width:11px;height:11px}
.list-actions{gap:3px}.list-item .rename{min-width:32px;padding:7px 6px;font-size:16px;background:transparent;color:#6e7e8d}.list-item .go{font-size:11px;padding:8px 7px}
@media(max-width:430px){.list-item{padding:10px 9px;gap:8px}.list-item .pc.cover{width:74px;height:46px;flex-basis:74px}.list-item .go{font-size:10px;padding:7px 6px}.list-item .star{padding:4px}.list-item .rename{padding:4px;min-width:26px}}
'''
          p.write_text(css)

          p=Path('pwa/index.html')
          h=p.read_text().replace('Versão PWA 2.3.0','Versão PWA 2.4.0')
          p.write_text(h)

          p=Path('pwa/sw.js')
          sw=p.read_text().replace("chv-remote-pwa-v2.3.0","chv-remote-pwa-v2.4.0")
          p.write_text(sw)
          PY
          node --check pwa/app.js
          grep -q 'Versão PWA 2.4.0' pwa/index.html
          grep -q 'chv-remote-pwa-v2.4.0' pwa/sw.js
          grep -q 'function followCursorPan' pwa/app.js
          grep -q 'function renameConnection' pwa/app.js
          grep -q 'blockIOSNativeGesture' pwa/app.js
      - name: Commit source and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/app.css pwa/index.html pwa/sw.js
          git commit -m 'Fix iPhone gestures, zoom cursor follow and connection covers'
          git push origin main
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          git show main:pwa/app.js > app.js
          git show main:pwa/app.css > app.css
          git show main:pwa/index.html > index.html
          git show main:pwa/sw.js > sw.js
          git add app.js app.css index.html sw.js
          git commit -m 'Publish CHV Remote Web 2.4'
          git push origin gh-pages
