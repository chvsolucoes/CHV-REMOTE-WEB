name: Deploy CHV Remote PWA

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '.github/workflows/deploy-pwa-pages.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chv-remote-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover and verify current CHV Relay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'websockets>=15,<17' requests
          python - <<'PY'
          import asyncio, json, re, time, requests, websockets
          html=requests.get('https://linktr.ee/chvsolucoes',timeout=20,headers={'User-Agent':'Mozilla/5.0'}).text
          hosts=[]
          for h in re.findall(r'https?://([a-zA-Z0-9.-]+\.trycloudflare\.com)',html):
              if h not in hosts: hosts.append(h)
          if not hosts: raise SystemExit('No CHV trycloudflare relay found on Linktree')
          async def probe(host):
              url='wss://'+host
              try:
                  async with websockets.connect(url,open_timeout=10,close_timeout=3,max_size=2**20) as ws:
                      await ws.send(json.dumps({'type':'hello','role':'probe','client':'chv-remote-pwa','version':25,'nonce':str(time.time_ns())}))
                      raw=await asyncio.wait_for(ws.recv(),timeout=10)
                      obj=json.loads(raw)
                      if obj.get('type')=='health' and obj.get('status')=='ok' and obj.get('service')=='chv-relay': return url
              except Exception as e: print('probe failed',url,type(e).__name__)
          async def main():
              for h in hosts:
                  url=await probe(h)
                  if url:
                      with open('pwa/relay.json','w') as f: json.dump({'url':url,'updated':int(time.time())},f)
                      print('CHV_PWA_RELAY_OK',url); return
              raise SystemExit('No healthy CHV relay candidate')
          asyncio.run(main())
          PY

      - name: Validate PWA files
        run: |
          test -s pwa/index.html
          test -s pwa/app.js
          test -s pwa/sw.js
          test -s pwa/manifest.webmanifest
          test -s pwa/icon.svg
          python -m json.tool pwa/manifest.webmanifest >/dev/null
          python -m json.tool pwa/relay.json >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
