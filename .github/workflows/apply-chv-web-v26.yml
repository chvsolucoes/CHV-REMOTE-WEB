name: Apply CHV Remote Web 2.6
on:
  push:
    paths:
      - '.github/workflows/apply-chv-web-v26.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate
        run: |
          python3 tools/apply_v26.py
          node --check pwa/app.js
          grep -q 'Versão PWA 2.6.0' pwa/index.html
          grep -q 'chv-remote-pwa-v2.6.0' pwa/sw.js
          grep -q 'function noteInteraction' pwa/app.js
          grep -q 'function postInputRefresh' pwa/app.js
          grep -q 'capture:true' pwa/app.js
      - name: Commit and publish
        run: |
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/index.html pwa/sw.js
          git commit -m 'Improve input latency, double-drag and iOS gesture blocking'
          git push origin main
          git fetch origin gh-pages
          git switch -C gh-pages origin/gh-pages
          git show main:pwa/app.js > app.js
          git show main:pwa/index.html > index.html
          git show main:pwa/sw.js > sw.js
          git add app.js index.html sw.js
          git commit -m 'Publish CHV Remote Web 2.6'
          git push origin gh-pages
