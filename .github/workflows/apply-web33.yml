name: Apply CHV Remote Web 3.3 fixes

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_web33.py'
      - '.github/workflows/apply-web33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Web 3.3 patch
        run: python tools/apply_web33.py
      - name: Validate Web 3.3
        shell: bash
        run: |
          set -euo pipefail
          grep -q "chv-remote-pwa-v3.3.0" pwa/sw.js
          grep -q "keyboardTarget" pwa/app.js
          grep -q "const kp=state.keyboardTarget||state.cursor" pwa/app.js
          grep -q "0,60,150,280,460,700" pwa/app.js
          grep -q "Versão PWA 3.3.0" pwa/index.html
          grep -q "autoAudio:true,autoMic:true" pwa/app.js
          grep -q "permission_state" pwa/app.js
          grep -q "Downloads / CHV Remote" pwa/app.js
          node --check pwa/app.js
          echo CHV_WEB33_VALIDATION_OK
      - name: Commit generated PWA
        shell: bash
        run: |
          git config user.name 'CHV Remote Bot'
          git config user.email 'chvsolucoes@users.noreply.github.com'
          git add pwa/app.js pwa/index.html pwa/sw.js
          if git diff --cached --quiet; then
            echo CHV_WEB33_ALREADY_APPLIED
            exit 0
          fi
          git commit -m 'CHV Remote Web 3.3 keep tapped field above mobile keyboard'
          git push origin HEAD:main
